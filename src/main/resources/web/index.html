<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Code Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="mesh-bg"></div>
    
    <div class="container">
        <header class="header">
            <h1>CodeSync</h1>
            <p class="tagline">Real-time Collaborative Editor</p>
        </header>

        <div id="landing-screen" class="screen active">
            <div class="card">
                <div class="card-content">
                    <h2>Get Started</h2>
                    <p>Choose how you want to collaborate</p>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="showServerPanel()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                            Start Server
                        </button>
                        <button class="btn btn-secondary" onclick="showJoinPanel()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            Join Server
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="server-panel" class="screen">
            <div class="card">
                <button class="btn-back" onclick="showLanding()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back
                </button>
                <div class="card-content">
                    <h2>Start Server</h2>
                    <div class="form-group">
                        <label>Port Number</label>
                        <input type="number" id="server-port" value="5000" min="1024" max="65535">
                    </div>
                    <div class="lan-ips" id="lan-ips">
                        <p class="label">Available LAN Addresses:</p>
                        <div class="ips-list" id="ips-list"></div>
                    </div>
                    <button class="btn btn-primary btn-full" onclick="startServer()">Start Server</button>
                    <p class="status" id="server-status"></p>
                </div>
            </div>
        </div>

        <div id="join-panel" class="screen">
            <div class="card">
                <button class="btn-back" onclick="showLanding()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back
                </button>
                <div class="card-content">
                    <h2>Join Server</h2>
                    <div class="form-group">
                        <label>Server IP</label>
                        <input type="text" id="join-ip" placeholder="192.168.1.100">
                    </div>
                    <div class="form-group">
                        <label>Port</label>
                        <input type="number" id="join-port" value="5000" min="1024" max="65535">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Enter your name">
                    </div>
                    <button class="btn btn-primary btn-full" onclick="joinServer()">Connect</button>
                    <p class="status" id="join-status"></p>
                </div>
            </div>
        </div>

        <div id="editor-screen" class="screen">
            <div class="editor-container">
                <div class="editor-header">
                    <div class="connection-info">
                        <span class="status-dot"></span>
                        <span id="connection-text">Connected</span>
                    </div>
                    <div class="users-list" id="users-list"></div>
                    <button class="btn btn-danger" onclick="leaveSession()">Leave</button>
                </div>
                <div class="editor-wrapper">
                    <textarea id="code-editor" spellcheck="false" placeholder="Start typing..."></textarea>
                </div>
                <div class="editor-footer">
                    <span id="version-info">Version: 0</span>
                    <span id="char-count">Characters: 0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
