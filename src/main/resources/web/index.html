<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Code Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="mesh-bg"></div>
    
    <div class="container">
        <header class="header">
            <h1>CodeSync</h1>
            <p class="tagline">Real-time Collaborative Editor</p>
        </header>

        <div id="join-screen" class="screen active">
            <div class="card">
                <div class="card-content">
                    <h2>Join Session</h2>
                    <div id="connection-error" class="status error" style="display:none; margin-bottom:16px;"></div>
                    <div class="form-group">
                        <label>Server IP</label>
                        <input type="text" id="join-ip" placeholder="192.168.1.100">
                    </div>
                    <div class="form-group">
                        <label>Port</label>
                        <input type="number" id="join-port" value="5200" min="1024" max="65535">
                    </div>
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" id="username" placeholder="Enter your name">
                    </div>
                    <button class="btn btn-primary btn-full" onclick="connectToServer()">Connect</button>
                    <p class="status" id="join-status">Enter server details to collaborate</p>
                </div>
            </div>
        </div>

        <div id="editor-screen" class="screen">
            <div class="editor-container">
                <div class="editor-header">
                    <div class="connection-info">
                        <span class="status-dot"></span>
                        <span id="connection-text">Connecting...</span>
                    </div>
                    <div class="users-list" id="users-list"></div>
                    <button class="btn btn-danger" onclick="leaveSession()">Leave</button>
                </div>
                <div class="editor-wrapper">
                    <textarea id="code-editor" spellcheck="false" placeholder="Start typing..."></textarea>
                </div>
                <div class="editor-footer">
                    <span id="version-info">Version: 0</span>
                    <span id="char-count">Characters: 0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
